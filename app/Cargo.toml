[package]
name = "subradar"
version = "1.0.0"
edition = "2021"
authors = ["Laynexsw"]
description = "SubRadar v1.0 — %100 Saf Rust, Çevrimdışı ve Şifreli Yerel Masaüstü Abonelik Yöneticisi"
license = "LicenseRef-SubRadar-Commercial-1.0"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
