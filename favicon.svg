<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Radar Rings -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <circle cx="32" cy="32" r="16" fill="url(#radarSweep)"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="rgba(16,185,129,0.35)" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="rgba(16,185,129,0.5)" stroke-width="1.2"/>
  <!-- Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <!-- Radar Sweep Arm -->
  <line x1="32" y1="32" x2="50" y2="18" stroke="url(#neonGlow)" stroke-width="2" stroke-linecap="round"/>
  <!-- Target Blip -->
  <circle cx="46" cy="21" r="2.5" fill="#34d399"/>
  <!-- Center Core -->
  <circle cx="32" cy="32" r="3.5" fill="#10b981"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
</svg>
