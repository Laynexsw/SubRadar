<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Originkit Tiles Loader Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    body.sr-loading-lock { overflow: hidden; }
  </style>
</head>
<body>
  <!-- ORIGINKIT TILES LOADER -->
  <div id="sr-tiles-loader" aria-label="Loading" role="status" style="position: fixed; inset: 0; z-index: 99999; width: 100vw; height: 100vh; overflow: hidden; isolation: isolate;">
    <div id="sr-tiles-grid" style="position: absolute; inset: 0; overflow: hidden;"></div>
    <div id="sr-tiles-counter" aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; mix-blend-mode: difference; color: #ffffff; pointer-events: none; white-space: nowrap; font-family: 'Instrument Serif', 'Times New Roman', Times, serif; font-size: min(28vh, 36vw); font-variant-numeric: tabular-nums; opacity: 0; user-select: none;">
      <span style="display: inline-flex; align-items: flex-start;">
        <span id="sr-tiles-num">0</span>
        <span style="font-size: 0.3em; font-style: italic; margin-top: 0.9em; margin-left: 0.08em;">%</span>
      </span>
    </div>
  </div>

  <div style="text-align: center; max-width: 600px; padding: 2rem;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem;">SubRadar</h1>
    <p style="font-size: 1.25rem; opacity: 0.7;">Revealed successfully after Originkit Tiles Loader.</p>
    <button onclick="window.location.reload()" style="padding: 12px 24px; border-radius: 9999px; background: #fff; color: #000; border: none; font-weight: 600; cursor: pointer; margin-top: 1rem;">Replay Loader</button>
  </div>

  <script src="js/tiles-loader.js" type="module"></script>
  <script type="module">
    import { initTilesLoader } from './js/tiles-loader.js';
    initTilesLoader({
      minTime: 2.0,
      revealS: 1.5,
      onComplete: () => {
        console.log('Originkit Tiles Loader complete!');
      }
    });
  </script>
</body>
</html>
