<!-- 17. ÇEREZ VE KULLANICI ETKİLEŞİMİ TAKİP BİLDİRİMİ                        -->
<!-- ========================================================================= -->
<aside id="sr-privacy-banner" role="region" aria-label="Çerez ve Etkileşim Takibi" class="text-left" aria-live="polite">
  <div class="sr-cookie-card" id="sr-cookie-card">
    <!-- Header -->
    <div class="sr-cookie-header">
      <div class="sr-cookie-title-group">
        <span class="sr-cookie-pulse" aria-hidden="true"></span>
        <span class="material-symbols-outlined text-[18px] text-amber-400" aria-hidden="true">cookie</span>
        <h4 class="sr-cookie-title">Çerezler ve Etkileşim Takibi</h4>
      </div>
      <button type="button" id="sr-privacy-close" class="sr-cookie-close-btn" aria-label="Kapat">
        <span class="material-symbols-outlined text-[16px]">close</span>
      </button>
    </div>

    <!-- Description -->
    <p class="sr-cookie-desc">
      Deneyiminizi geliştirmek ve sitedeki her tıklama, kaydırma derinliği ve oturum hareketinizi saniye saniye analiz etmek için çerezler ve canlı analitik izleyiciler kullanıyoruz.
    </p>

    <!-- Footer Controls -->
    <div class="sr-cookie-footer">
      <div class="sr-cookie-telemetry-pill">
        <span class="sr-telemetry-live-dot" aria-hidden="true"></span>
        <span id="sr-active-seconds-badge">Oturum: 0s · Canlı İzleniyor</span>
      </div>

      <div class="sr-cookie-actions">
        <button type="button" id="sr-privacy-reject" class="sr-cookie-btn-ghost">
          <span>Reddet</span>
        </button>
        <button type="button" id="sr-privacy-accept" class="sr-cookie-btn-primary">
          <span>Tümünü Kabul Et</span>
        </button>
      </div>
    </div>
  </div>
</aside>
