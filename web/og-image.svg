<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogGlow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radarSweep" cx="820" cy="315" r="300">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07090e"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Radar Grid Background (Right side) -->
  <g transform="translate(820, 315)">
    <circle r="260" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    <circle r="200" fill="none" stroke="rgba(16, 185, 129, 0.12)" stroke-width="1.2"/>
    <circle r="140" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="80" fill="none" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5"/>
    <line x1="-260" y1="0" x2="260" y2="0" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1"/>
    <line x1="0" y1="-260" x2="0" y2="260" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1"/>
    
    <!-- Sweep Ray -->
    <polygon points="0,0 180,-120 220,-80" fill="rgba(16, 185, 129, 0.15)"/>
    <line x1="0" y1="0" x2="200" y2="-100" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Radar Intercept Blips -->
    <circle cx="140" cy="-70" r="7" fill="#10b981"/>
    <circle cx="140" cy="-70" r="14" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    
    <circle cx="-90" cy="110" r="5" fill="#f43f5e"/>
    <circle cx="60" cy="130" r="4.5" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Left Content Column -->
  <!-- Top Badge -->
  <g transform="translate(90, 95)">
    <rect width="280" height="38" rx="19" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
    <circle cx="20" cy="19" r="4.5" fill="#10b981"/>
    <text x="34" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">MASAÜSTÜ ABONELİK ZEKÂSI</text>
  </g>

  <!-- Brand Title -->
  <text x="90" y="210" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">SubRadar</text>
  <text x="410" y="210" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="64" font-weight="800">.</text>

  <!-- Tagline / Headline -->
  <text x="90" y="270" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="30" font-weight="600" letter-spacing="-0.5">Unutulan deneme tuzaklarını ve gizli</text>
  <text x="90" y="315" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="30" font-weight="600" letter-spacing="-0.5">abonelik zamlarını durdurun.</text>

  <!-- Value Propositions Card (Apple Glass) -->
  <g transform="translate(90, 360)">
    <rect width="560" height="175" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    
    <!-- Item 1 -->
    <g transform="translate(24, 30)">
      <circle cx="16" cy="16" r="16" fill="rgba(16, 185, 129, 0.15)"/>
      <path d="M12 16 L15 19 L21 13" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">%100 Yerel AES-256 Kasa</text>
      <text x="44" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Sıfır bulut, sıfır telemetri, banka şifresi istenmez</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 78)">
      <circle cx="16" cy="16" r="16" fill="rgba(99, 102, 241, 0.15)"/>
      <path d="M11 16 L15 20 L21 12" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">Tek Tıkla Doğrudan İptal</text>
      <text x="44" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Karanlık anket labirentleri yok, doğrudan fesih portalları</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 126)">
      <circle cx="16" cy="16" r="16" fill="rgba(244, 63, 94, 0.15)"/>
      <path d="M11 16 L15 20 L21 12" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">6502 SK &amp; GDPR m.17 Yasal İhtar</text>
      <text x="44" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Tek tıkla resmi abonelik iptal mektubu üretimi</text>
    </g>
  </g>

  <!-- Bottom OS Support Pills -->
  <g transform="translate(90, 565)">
    <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Masaüstü Platformları:</text>
    <rect x="145" y="0" width="85" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="187" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">macOS</text>
    <rect x="238" y="0" width="95" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="285" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Windows</text>
    <rect x="341" y="0" width="75" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="378" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Linux</text>
  </g>
</svg>
